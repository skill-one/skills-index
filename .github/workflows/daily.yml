name: daily-sync

# Generate the skills index and publish the results as a GitHub Release.
# Nothing is committed to the main branch (see .gitignore); each run is a
# self-contained snapshot uploaded as Release assets in two disjoint parts:
#   - data.tar.gz  published artifacts only (what data consumers download);
#   - cache.tar.gz per-repo incremental scan state (cache/by-source/), used
#     solely to restore the next run's pushed_at / skill-sha fingerprints.
# On main, index.jsonl is additionally force-pushed to the orphan `dist`
# branch so CDN proxies with CORS headers (jsDelivr and mirrors) can serve it
# to browsers.
#
# Triggers:
#   - Daily at 00:00 UTC (full refresh on `main`).
#   - Push to `main`  -> full refresh (all pages).
#   - Push to `test`  -> smoke test (single page, 1-page fetch).
#   - Manual run via workflow_dispatch.
#
# Old releases are pruned to keep at most KEEP_RELEASES entries (main only).

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - test
  workflow_dispatch: {}

# Only one run at a time: concurrent runs would race on the published Release
# (cache restore, publish, prune) and corrupt the incremental chain.
concurrency:
  group: daily-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  KEEP_RELEASES: "10"

jobs:
  # Gate every run (full refresh, smoke, scheduled) on lint + type-check +
  # tests before anything is scanned or published. Matrix covers the
  # requires-python range ends (>=3.11); publish only proceeds on green.
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src/skills_index

      - name: Test (pytest)
        run: uv run pytest --cov=skills_index --cov-report=term

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Decide fetch scope by branch
        id: scope
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          echo "branch=$branch"
          if [ "$branch" = "test" ]; then
            # Smoke test: fetch only 1 page.
            echo "pages_arg=--pages 1" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=alpha-" >> "$GITHUB_OUTPUT"
          else
            # Full refresh on main (and any other branch): fetch all pages.
            echo "pages_arg=" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=data-" >> "$GITHUB_OUTPUT"
            # Repos with more than 500 skills are excluded (default cap).
          fi
          # Human-readable, lexicographically sortable UTC timestamp used for
          # the release tag/name (e.g. 20260820T143015Z).
          echo "ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # Full refreshes (main) restore the previous run's per-repo incremental
      # state (cache/by-source/) from the newest `data-` release so the scan
      # can reuse pushed_at and skill-sha fingerprints. Smoke tests (test
      # branch, --pages 1) skip this and go through the clean full-build path,
      # leaving main's chain untouched.
      - name: Restore incremental cache from latest data- release
        if: steps.scope.outputs.pages_arg == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `latest` may point at a `test-` release, so resolve the newest
          # `data-` prefixed release by creation time instead.
          latest=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^data-' | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No previous data- release; running a full scan this time."
            exit 0
          fi
          echo "Restoring incremental cache from release: $latest"
          # Releases published before the cache/ split carry no cache.tar.gz;
          # a missing asset (like a failed restore) just means a full scan.
          if gh release download "$latest" --pattern cache.tar.gz; then
            rm -rf cache
            tar -xzf cache.tar.gz && rm -f cache.tar.gz
            echo "Restored cache/by-source/ from $latest"
          else
            echo "No cache.tar.gz in $latest; running a full scan this time."
          fi

      # GH_PAT (personal access token, 5000 req/h) is preferred over the
      # Actions GITHUB_TOKEN (1000 req/h per repo) to keep the meta phase fast;
      # tarball downloads (SKILL.md content) are not billed to the quota at all.
      - name: Fetch + scan + index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uv run skills-index update ${{ steps.scope.outputs.pages_arg }}

      # Sorted views of scanned-repos.jsonl (stars / skillCount, descending)
      # are publish-time derivatives: the pipeline writes scan order only, so
      # the core stays lean. jq's sort is stable, matching the previous Python
      # sort (ties keep fetch order).
      - name: Generate sorted repo views
        run: |
          set -euo pipefail
          jq -sc 'sort_by(-(.stars // 0))[]' data/github/scanned-repos.jsonl \
            > data/github/scanned-repos-by-stars.jsonl
          jq -sc 'sort_by(-(.skillCount // 0))[]' data/github/scanned-repos.jsonl \
            > data/github/scanned-repos-by-skillcount.jsonl

      - name: Package data snapshot
        run: |
          tar -czf data.tar.gz data/
          tar -czf cache.tar.gz cache/

      - name: Build Release body from run summary
        id: report
        run: |
          set -euo pipefail
          {
            echo "body<<REPORT_EOF"
            cat data/run-summary.md
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          # `<prefix>-<UTC timestamp>` so releases are human-readable and sort
          # chronologically by tag (e.g. data-20260820T143015Z).
          tag_name: ${{ steps.scope.outputs.tag_prefix }}${{ steps.scope.outputs.ts }}
          name: "${{ steps.scope.outputs.tag_prefix }}${{ steps.scope.outputs.ts }}"
          # Smoke (alpha-) releases are marked prerelease so GitHub's
          # `releases/latest` — and README's latest/download path — always
          # resolves to a full `data-` snapshot, never a 1-page smoke run.
          prerelease: ${{ steps.scope.outputs.tag_prefix == 'alpha-' }}
          body: |
            Automated skills index snapshot.
            Branch: `${{ github.ref_name }}`
            Scope: ${{ github.ref_name == 'test' && 'smoke test (1 page)' || 'full refresh (all pages)' }}
            Generated at ${{ steps.scope.outputs.ts }} (UTC).

            ${{ steps.report.outputs.body }}
          # Asset names are flat basenames (data/ and cache/ prefixes are
          # stripped), so the in-repo directory layout below does not change
          # download URLs: releases/download/<tag>/index.jsonl stays stable.
          files: |
            data.tar.gz
            cache.tar.gz
            data/index/index.jsonl
            data/index/index-meta.json
            data/skills-sh/fetched-skills.jsonl
            data/github/scanned-repos.jsonl
            data/github/scanned-repos-by-stars.jsonl
            data/github/scanned-repos-by-skillcount.jsonl
            data/run-summary.md

      # Single-snapshot orphan branch (force-pushed, no history accumulation):
      # makes index.jsonl addressable as a normal git file so CORS-enabled CDN
      # proxies (cdn.jsdelivr.net / cdn.jsdmirror.com /gh/...@dist/...) can
      # serve it — release assets are not proxyable. index-meta.json rides
      # along so CDN consumers can read generatedAt / formatVersion. Main
      # only, so smoke runs on `test` never overwrite the published index.
      - name: Publish index.jsonl to dist branch (CDN-accessible)
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dist" && mkdir -p "$RUNNER_TEMP/dist" && cd "$RUNNER_TEMP/dist"
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The dist branch keeps a flat layout so CDN URLs stay stable
          # (.../gh/<repo>@dist/index.jsonl) regardless of the data/ tree.
          cp "$GITHUB_WORKSPACE/data/index/index.jsonl" .
          cp "$GITHUB_WORKSPACE/data/index/index-meta.json" .
          git add index.jsonl index-meta.json
          git commit -m "index snapshot ${{ steps.scope.outputs.ts }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist

      # Prune only on main, so test smoke runs don't consume the retention quota.
      - name: Prune old releases
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASES }}
          PREFIX: ${{ steps.scope.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          # Prune only this prefix's releases (keep test- smoke runs untouched).
          mapfile -t RELEASES < <(gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | .[].tagName' | grep "^${PREFIX}")
          total=${#RELEASES[@]}
          if [ "$total" -le "$KEEP" ]; then
            echo "Nothing to prune ($total <= $KEEP)."
            exit 0
          fi
          to_delete=$(( total - KEEP ))
          echo "Pruning $to_delete oldest ${PREFIX} release(s) (keeping $KEEP)."
          for (( i=0; i<to_delete; i++ )); do
            tag="${RELEASES[$i]}"
            echo "Deleting $tag"
            gh release delete "$tag" --yes || true
            git push --delete origin "$tag" || true
          done
