name: daily-sync

# Generate the skills index and publish the results as a GitHub Release.
# Nothing is committed to the main branch (see .gitignore); each run is a
# self-contained snapshot published as two flat Release assets:
#   - index.jsonl       the product;
#   - index-meta.json   its metadata (formatVersion / generatedAt / counts / tag);
# the run report is `update`'s stdout, captured into the runner's temp space
# and attached as the Release body (no separate asset).
# On main, index.jsonl + index-meta.json are force-pushed to the orphan `dist`
# branch (CDN/CORS path) and the release tag is created ON the dist commit, so
# the tag names an immutable snapshot addressable both as a Release download
# and as a CDN URL (cdn.jsdelivr.net/gh/<repo>@<tag>/index.jsonl). The tag is
# written into index-meta.json before anything is pushed, so no backfill pass
# is needed and every copy is identical by construction.
# The pipeline is fully stateless: `lastCommitAt` comes straight from git
# history each run; nothing is carried between runs.
#
# Triggers:
#   - Daily at 00:00 UTC (full refresh on `main`).
#   - Push to `main`  -> full refresh (all pages).
#   - Push to `test`  -> smoke test (single page, 1-page fetch).
#   - Manual run via workflow_dispatch.
#
# Old releases are pruned to keep at most KEEP_RELEASES entries (main only).

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - test
  workflow_dispatch: {}

# Only one run at a time: concurrent runs would race on the dist push and
# the release tag.
concurrency:
  group: daily-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  KEEP_RELEASES: "10"

jobs:
  # Gate every run (full refresh, smoke, scheduled) on lint + type-check +
  # tests before anything is scanned or published. Matrix covers the
  # requires-python range ends (>=3.11); publish only proceeds on green.
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src/skills_index

      - name: Test (pytest)
        run: uv run pytest --cov=skills_index --cov-report=term

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Decide fetch scope and release tag
        id: scope
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          echo "branch=$branch"
          if [ "$branch" = "test" ]; then
            # Smoke test: fetch only 1 page; prerelease, never `releases/latest`.
            echo "pages=1" >> "$GITHUB_OUTPUT"
            echo "tag=alpha-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          else
            # Full refresh on main (and any other branch): fetch all pages.
            echo "pages=0" >> "$GITHUB_OUTPUT"
            echo "tag=data-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          fi

      # GH_PAT (personal access token, 5000 req/h) is preferred over the
      # Actions GITHUB_TOKEN (1000 req/h per repo) to keep the meta phase fast;
      # git clones (SKILL.md content, commit history) are not billed to the
      # quota at all.
      - name: Fetch + scan + index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # The report goes to stdout; capture it as the future Release body.
          uv run skills-index update \
            --pages ${{ steps.scope.outputs.pages }} \
            --tag ${{ steps.scope.outputs.tag }} \
            > "$RUNNER_TEMP/run-summary.md"
          cat "$RUNNER_TEMP/run-summary.md"

      # Publish the CDN-accessible snapshot to the orphan `dist` branch: a
      # flat, force-pushed branch carrying index.jsonl + index-meta.json, so
      # CORS-enabled CDN proxies (cdn.jsdelivr.net /gh/...@<ref>/...) can serve
      # them — release assets are not proxyable. Main only, so smoke runs on
      # `test` never overwrite the published snapshot. Single commit: the tag
      # was already written into the meta before this push, so there is no
      # backfill pass and the dist and Release copies are identical by
      # construction.
      - name: Publish index.jsonl to dist branch (CDN-accessible)
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dist" && mkdir -p "$RUNNER_TEMP/dist" && cd "$RUNNER_TEMP/dist"
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Flat layout so CDN URLs stay stable (.../gh/<repo>@<tag>/index.jsonl).
          cp "$GITHUB_WORKSPACE/data/index.jsonl" .
          cp "$GITHUB_WORKSPACE/data/index-meta.json" .
          git add index.jsonl index-meta.json
          git commit -m "index snapshot ${{ steps.scope.outputs.tag }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist

      # The release tag is created ON the dist commit (main only): the tag
      # then names an immutable snapshot for both URL schemes —
      #   releases/download/<tag>/index.jsonl
      #   cdn.jsdelivr.net/gh/<repo>@<tag>/index.jsonl   (CDN caches tags
      #     permanently, like commit shas)
      # The run report (captured from `update` stdout into the runner's temp
      # space) is the Release body — it is not uploaded as a separate asset.
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file "$RUNNER_TEMP/run-summary.md")
          if [ "${{ github.ref_name }}" = "main" ]; then
            args+=(--target dist)
          else
            # Smoke: prerelease so `releases/latest` always means a full run.
            args+=(--prerelease --target main)
          fi
          gh release create "$TAG" "${args[@]}" \
            data/index.jsonl \
            data/index-meta.json

      # Prune only on main, so test smoke runs don't consume the retention quota.
      - name: Prune old releases
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASES }}
        run: |
          set -euo pipefail
          # Prune only data- releases (keep alpha- smoke runs untouched).
          mapfile -t RELEASES < <(gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | .[].tagName' | grep "^data-")
          total=${#RELEASES[@]}
          if [ "$total" -le "$KEEP" ]; then
            echo "Nothing to prune ($total <= $KEEP)."
            exit 0
          fi
          to_delete=$(( total - KEEP ))
          echo "Pruning $to_delete oldest data- release(s) (keeping $KEEP)."
          for (( i=0; i<to_delete; i++ )); do
            tag="${RELEASES[$i]}"
            echo "Deleting $tag"
            gh release delete "$tag" --yes || true
            git push --delete origin "$tag" || true
          done
